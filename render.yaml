services:
  - type: web
    name: landing-mendodata
    runtime: static
    # Sitio estático: no hay build, solo se publica el index.html de la raíz
    buildCommand: ""
    staticPublishPath: .
    # Cualquier ruta desconocida cae en la landing (una sola página)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
